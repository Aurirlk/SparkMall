<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    cart.html - 购物车页面
    ============================================================
    功能说明：购物车页面，包含：
              - 商品列表（勾选、图片、名称、规格、数量、价格）
              - 全选/取消全选
              - 数量增减（步进器）
              - 底部合计与结算按钮
              - 空购物车状态
    适用课程：《网页设计与制作》实训课教学
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="js/rem.js"></script>
  <link rel="stylesheet" href="css/iconfont.css">
  <link rel="stylesheet" href="css/compiled/style.css">
  <link rel="stylesheet" href="css/compiled/cart.css">
  <title>校园商城 - 购物车</title>
</head>
<body>

  <!-- ==================== 顶部导航栏 ==================== -->
  <header class="cart-header">
    <a href="javascript:history.back()" class="btn-back">
      <i class="iconfont ri-arrow-left-line"></i>
    </a>
    <span class="header-title">购物车</span>
    <span class="btn-edit" id="btnEdit">编辑</span>
  </header>

  <!-- ==================== 购物车主体内容 ==================== -->
  <main class="cart-content">

    <!-- ---------- 购物车商品列表 ---------- -->
    <div class="cart-list" id="cartList">

      <!-- 商品项 1 -->
      <div class="cart-item" data-price="89.9" data-id="1">
        <span class="check-box checked">
          <i class="check-off iconfont ri-checkbox-blank-circle-line"></i>
          <i class="check-on iconfont ri-checkbox-circle-fill"></i>
        </span>
        <img class="item-img" src="images/product/product-1.png" alt="女士连衣裙">
        <div class="item-info">
          <div class="item-title">优雅米色法式连衣裙 V领收腰 柔软面料</div>
          <div class="item-spec">颜色:米色 | 尺码:M</div>
          <div class="item-price-row">
            <span class="item-price">89.9</span>
            <div class="qty-stepper">
              <button class="btn-minus">-</button>
              <span class="qty-num">2</span>
              <button class="btn-plus">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 商品项 2 -->
      <div class="cart-item" data-price="25.9" data-id="2">
        <span class="check-box checked">
          <i class="check-off iconfont ri-checkbox-blank-circle-line"></i>
          <i class="check-on iconfont ri-checkbox-circle-fill"></i>
        </span>
        <img class="item-img" src="images/product/product-4.png" alt="蓝牙耳机">
        <div class="item-info">
          <div class="item-title">白色真无线蓝牙耳机 降噪运动 超长续航</div>
          <div class="item-spec">颜色:白色 标准版</div>
          <div class="item-price-row">
            <span class="item-price">25.9</span>
            <div class="qty-stepper">
              <button class="btn-minus">-</button>
              <span class="qty-num">1</span>
              <button class="btn-plus">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 商品项 3 -->
      <div class="cart-item" data-price="49.9" data-id="3">
        <span class="check-box checked">
          <i class="check-off iconfont ri-checkbox-blank-circle-line"></i>
          <i class="check-on iconfont ri-checkbox-circle-fill"></i>
        </span>
        <img class="item-img" src="images/product/product-10.png" alt="女士墨镜">
        <div class="item-info">
          <div class="item-title">黑色大框太阳镜 金色镜腿 防紫外线 时尚百搭</div>
          <div class="item-spec">颜色:黑色 经典款</div>
          <div class="item-price-row">
            <span class="item-price">49.9</span>
            <div class="qty-stepper">
              <button class="btn-minus">-</button>
              <span class="qty-num">1</span>
              <button class="btn-plus">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 商品项 4 -->
      <div class="cart-item" data-price="15.9" data-id="4">
        <span class="check-box">
          <i class="check-off iconfont ri-checkbox-blank-circle-line"></i>
          <i class="check-on iconfont ri-checkbox-circle-fill"></i>
        </span>
        <img class="item-img" src="images/product/product-5.png" alt="男士卫衣">
        <div class="item-info">
          <div class="item-title">浅灰色连帽卫衣 纯棉质感 宽松休闲</div>
          <div class="item-spec">颜色:浅灰 | 尺码:L</div>
          <div class="item-price-row">
            <span class="item-price">15.9</span>
            <div class="qty-stepper">
              <button class="btn-minus">-</button>
              <span class="qty-num">1</span>
              <button class="btn-plus">+</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- ---------- 空购物车状态（默认隐藏） ---------- -->
    <div class="empty-cart" id="emptyCart" style="display:none;">
      <i class="iconfont iconfont-xl ri-shopping-cart-line" style="color:#cccccc;"></i>
      <p class="empty-text">购物车空空如也</p>
      <p class="empty-sub">快去挑选心仪的商品吧~</p>
      <a href="list.html" class="btn-go-shop">去逛逛</a>
    </div>

    <!-- ---------- 猜你喜欢推荐区 ---------- -->
    <section class="recommend-section">
      <div class="section-header">
        <span class="title">猜你喜欢</span>
        <span class="more">换一批 <i class="iconfont ri-refresh-line"></i></span>
      </div>
      <div class="product-grid">
        <div class="product-card">
          <img class="product-img" src="images/product/product-8.png" alt="智能手表">
          <div class="product-info">
            <div class="product-title">黑色方形智能手表 多功能</div>
            <div class="price-row">
              <span class="price-now">45.9</span>
              <button class="btn-cart">
                <i class="iconfont ri-shopping-cart-line"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="product-card">
          <img class="product-img" src="images/product/product-3.png" alt="女士手提包">
          <div class="product-info">
            <div class="product-title">焦糖色真皮手提包 简约大方</div>
            <div class="price-row">
              <span class="price-now">299.9</span>
              <button class="btn-cart">
                <i class="iconfont ri-shopping-cart-line"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== 底部结算栏 ==================== -->
  <footer class="cart-bar">
    <div class="bar-left">
      <span class="check-box check-all checked" id="checkAll">
        <i class="check-off iconfont ri-checkbox-blank-circle-line"></i>
        <i class="check-on iconfont ri-checkbox-circle-fill"></i>
      </span>
      <span class="all-text">全选</span>
    </div>
    <div class="bar-right">
      <div class="total-wrap">
        <span class="total-label">合计:</span>
        <span class="total-price" id="totalPrice">181.6</span>
      </div>
      <button class="btn-settle" id="btnSettle">结算(3)</button>
    </div>
  </footer>

  <!-- ==================== 底部导航栏 ==================== -->
  <footer class="tabbar">
    <div class="tab-item" data-link="index.html">
      <i class="iconfont ri-home-line"></i>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab-item" data-link="list.html">
      <i class="iconfont ri-apps-2-line"></i>
      <span class="tab-label">分类</span>
    </div>
    <div class="tab-item active" data-link="cart.html">
      <i class="iconfont ri-shopping-cart-line"></i>
      <span class="tab-label">购物车</span>
    </div>
    <div class="tab-item" data-link="my.html">
      <i class="iconfont ri-user-line"></i>
      <span class="tab-label">我的</span>
    </div>
    <!-- 中间凸起 AI 导购按钮 -->
    <div class="tab-center" onclick="location.href='ai-chat.html'">
      <i class="iconfont ri-customer-service-2-line"></i>
      <span class="tab-label">AI导购</span>
    </div>
  </footer>

  <!-- ==================== 删除确认弹窗 ==================== -->
  <div class="dialog-overlay" id="delDialog" style="display:none;">
    <div class="dialog-box">
      <p class="dialog-msg">确定要删除选中的商品吗？</p>
      <div class="dialog-btns">
        <button class="btn-cancel" id="btnCancel">取消</button>
        <button class="btn-confirm" id="btnConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- ==================== JavaScript脚本 ==================== -->
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>

</body>
</html>
